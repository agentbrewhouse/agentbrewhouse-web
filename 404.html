<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0a0806; --amber: #c8832a; --amber-light: #e8a84a; --cream: #f0e6d0; --muted: #7a6a52; --border: rgba(200,131,42,0.22); }
body { min-height: 100vh; background: var(--bg); color: var(--cream); font-family: 'DM Mono', monospace; display: flex; flex-direction: column; }
nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid var(--border); }

main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 64px 24px; }
.eyebrow { font-size: 11px; letter-spacing: 0.35em; color: var(--amber); text-transform: uppercase; margin-bottom: 18px; }
h1 { font-family: 'Playfair Display', serif; font-size: clamp(36px, 6vw, 64px); font-weight: 700; line-height: 1.05; margin-bottom: 18px; }
h1 em { font-style: italic; color: var(--amber-light); }
p { max-width: 440px; font-size: 13px; line-height: 1.8; color: var(--muted); margin-bottom: 32px; }
.links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.links a { text-decoration: none; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; padding: 14px 18px; border: 1px solid var(--border); color: var(--cream); }
.links a.primary { background: var(--amber); color: var(--bg); border-color: var(--amber); font-weight: bold; }
.links a:hover { border-color: var(--amber); color: var(--amber-light); }
.links a.primary:hover { background: var(--amber-light); color: var(--bg); }
